name: Publish ATLAS
on:
  push:
    branches: [main]
  schedule:
    # Hourly agent newsroom run; GitHub may delay scheduled runs.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Test newsroom, cabinet, payments and subscriptions
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Official release announcements (two deterministic checks)
        if: github.event_name != 'push'
        run: python3 tools/publish.py
      - name: Agent newsroom (search, independent verification, bilingual rewrite)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLAS_MAX_STORIES_PER_RUN: ${{ vars.ATLAS_MAX_STORIES_PER_RUN || '6' }}
        run: node tools/agents-run.js
      - name: Build public version
        run: python3 tools/build-preview.py
      - name: Telegram delivery when configured
        # Remove the TELEGRAM_BOT_TOKEN secret once the VPS worker delivers, so posts are never sent twice.
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node tools/telegram-deliver.js
      - name: Save verified public snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/published.json config/agent-seen.json docs/index.html docs/cabinet.html atlas-demo.html
          if [ -f config/telegram-deliveries.json ]; then git add config/telegram-deliveries.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified ATLAS publications'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
