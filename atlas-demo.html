030 года", "en": "Geoffroy Roux de Bézieux Appointed to Lead 2030 Winter Olympics Organizing Committee"}, "body": {"ru": "Бывший глава Движения предпринимателей Франции (MEDEF) Жоффруа Ру де Безье назначен руководителем оргкомитета зимних Олимпийских и Паралимпийских игр 2030 года.", "en": "Former MEDEF president Geoffroy Roux de Bézieux has been named head of the organizing committee for the 2030 Winter Olympic and Paralympic Games in France."}, "content": {"ru": ["Бывший председатель Движения предпринимателей Франции (MEDEF) Жоффруа Ру де Безье назначен руководителем оргкомитета зимних Олимпийских и Паралимпийских игр 2030 года во Франции. Об этом сообщает Le Figaro, передает «Спорт-Экспресс».", "На этой должности Ру де Безье сменил Эдгара Гроспирона, который ранее возглавлял структуру, отвечающую за подготовку к национальным Олимпийским и Паралимпийским играм.", "Новое руководство оргкомитета берет на себя администрирование ключевых процессов подготовки к международным зимним соревнованиям 2030 года."], "en": ["Former president of the Movement of French Enterprises (MEDEF) Geoffroy Roux de Bézieux has been appointed head of the organizing committee for the 2030 Winter Olympic and Paralympic Games in France, according to Le Figaro.", "Roux de Bézieux replaces Edgar Grospiron in this position, taking over the leadership of the body responsible for preparing the multi-sport event.", "The leadership change places the former business executive at the head of preparations for both the Olympic and Paralympic Winter Games scheduled for 2030 in France."]}, "importance": {"ru": "Смена руководства оргкомитета определяет новый управленческий подход к подготовке зимних Олимпийских и Паралимпийских игр 2030 года во Франции.", "en": "The appointment shifts the leadership of the body overseeing preparations for France's 2030 Olympic and Paralympic Winter Games to a prominent business figure."}, "next": {"ru": "Оргкомитету под новым руководством предстоит продолжить организационные работы по подготовке к проведению Игр 2030 года.", "en": "The organizing committee under its new leadership will proceed with official preparations for hosting the 2030 Winter Games."}, "telegramText": {"ru": "Бывший председатель Движения предпринимателей Франции (MEDEF) Жоффруа Ру де Безье возглавил оргкомитет зимних Олимпийских и Паралимпийских игр 2030 года во Франции. Об этом пишет Le Figaro. На этом посту он сменил Эдгара Гроспирона. Новое руководство оргкомитета будет отвечать за подготовку предстоящих зимних Игр.", "en": "Former head of the Movement of French Enterprises (MEDEF) Geoffroy Roux de Bézieux has been appointed president of the organizing committee for the 2030 Winter Olympic and Paralympic Games in France. According to Le Figaro, he succeeds Edgar Grospiron in the role. Roux de Bézieux will lead the organizational preparations for both the Olympic and Paralympic Winter Games."}, "imageQuery": "Geoffroy Roux de Bezieux", "status": "published", "demo": false, "priority": 3, "originalTitle": "Former MEDEF Head Geoffroy Roux de Bézieux Appointed to Lead 2030 Winter Olympics Organizing Committee", "source": {"name": "РБК", "url": "https://www.rbc.ru/sport/29/10/2026/6ae33c232fd1a98b116df3d5", "language": "en"}, "sources": [{"publisher": "РБК", "url": "https://www.rbc.ru/sport/29/10/2026/6ae33c232fd1a98b116df3d5", "confirms": true}, {"publisher": "Спорт-Экспресс", "url": "https://www.sport-express.ru/olympics/news/eks-predsedatel-medef-ru-de-beze-vozglavil-orgkomitet-olimpiady-2030-vo-francii-2468686/", "confirms": true}], "publishedAt": "2026-10-29T12:55:19.000Z", "updatedAt": "2026-10-29T12:55:19.000Z", "collectedAt": "2026-10-29T13:06:24.551Z", "sitePublishedAt": "2026-10-29T13:06:24.551Z", "publicationMode": "agents", "translationStatus": "ai-bilingual", "factsReviewed": false, "verification": {"verdict": "cross-source", "independentSources": 2, "disputedFacts": [], "problems": [], "notes": "Reported by several outlets in their own feeds", "checkedAt": "2026-10-29T13:06:24.551Z"}, "image": {"url": "https://upload.wikimedia.org/wikipedia/commons/2/27/REF.090_28_08_2019_cRM_I.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled", "title": "REF.090 28 08 2019 cRM I", "creator": "Kbeka2", "license": "CC BY-SA 4.0", "licenseUrl": "https://creativecommons.org/licenses/by-sa/4.0", "sourceUrl": "https://commons.wikimedia.org/wiki/File:REF.090_28_08_2019_cRM_I.jpg", "provider": "Wikimedia Commons", "query": "Geoffroy Roux de Bezieux"}, "imageSearchedAt": "2026-10-29T13:19:29.348Z", "archive": false}, {"id": "agent-c348b9789a0b99d21f2e", "category": "economy", "country": "US", "title": {"ru": "ВВП США в третьем квартале 2026 года вырос на 3,4%", "en": "U.S. GDP Grows at Faster-Than-Expected 3.4% Rate in Third Quarter of 2026"}, "body": {"ru": "Экономика США в третьем квартале 2026 года увеличилась на 3,4% в пересчете на годовые темпы, превысив прогнозы аналитиков.", "en": "The United States economy grew at an annualized rate of 3.4% in the third quarter of 2026, exceeding forecasts."}, "content": {"ru": ["По предварительным данным Министерства торговли США, которые приводит «Интерфакс», темпы роста валового внутреннего продукта страны оказались выше ожиданий рынка.", "Как сообщает The New York Times со ссылкой на федеральную статистику, ключевыми драйверами подъема американского ВВП в третьем квартале стали потребительские расходы и затраты компаний, работающих в сфере искусственного интеллекта.", "Опубликованные цифры отражают первоначальную оценку динамики экономики за прошедший квартал."], "en": ["The preliminary figures from the U.S. Department of Commerce showed an economic expansion that outpaced market projections, according to Interfax.", "Federal data cited by The New York Times indicated that gross domestic product growth during the three-month period was powered by consumer spending alongside outlays from artificial intelligence companies.", "The initial estimate reflects economic performance during the quarter ahead of subsequent government revisions."]}, "importance": {"ru": "Показатели свидетельствуют о сохранении устойчивости американской экономики, поддерживаемой потребительским сектором и растущими инвестициями в технологии искусственного интеллекта.", "en": "The data highlights steady momentum in the world's largest economy, driven by consumer activity and sustained corporate expenditure in the artificial intelligence sector."}, "next": {"ru": "Министерство торговли США опубликует последующие пересмотренные оценки динамики ВВП за третий квартал в рамках стандартного графика статистических релизов.", "en": "The Department of Commerce will release revised estimates for third-quarter gross domestic product in upcoming updates."}, "telegramText": {"ru": "ВВП США в третьем квартале 2026 года увеличился на 3,4% в пересчете на годовые темпы, превысив предварительные прогнозы. Об этом свидетельствуют первые оценки Министерства торговли США, сообщает «Интерфакс». Согласно сведениям The New York Times, основную поддержку подъему оказали потребительские расходы и инвестиции компаний сектора искусственного интеллекта.", "en": "The U.S. economy expanded at an annualized rate of 3.4% in the third quarter of 2026, beating expectations. According to preliminary Department of Commerce data reported by Interfax, growth was stronger than anticipated. Federal figures highlighted by The New York Times showed that the increase was primarily driven by consumer spending and outlays from artificial intelligence firms."}, "status": "published", "demo": false, "priority": 3, "originalTitle": "US Economy Grows at Faster-Than-Expected 3.4% Rate in Third Quarter", "source": {"name": "The New York Times", "url": "https://www.nytimes.com/2026/10/29/business/economy/us-economy-gdp.html", "language": "en"}, "sources": [{"publisher": "The New York Times", "url": "https://www.nytimes.com/2026/10/29/business/economy/us-economy-gdp.html", "confirms": true}, {"publisher": "Интерфакс", "url": "https://www.interfax.ru/business/1125827", "confirms": true}], "publishedAt": "2026-10-29T12:35:00.000Z", "updatedAt": "2026-10-29T12:35:00.000Z", "collectedAt": "2026-10-29T12:41:04.181Z", "sitePublishedAt": "2026-10-29T12:41:04.181Z", "publicationMode": "agents", "translationStatus": "ai-bilingual", "factsReviewed": false, "verification": {"verdict": "cross-source", "independentSources": 2, "disputedFacts": [], "problems": [], "notes": "Reported by several outlets in their own feeds", "checkedAt": "2026-10-29T12:41:04.181Z"}, "archive": false, "imageSearchedAt": "2026-10-29T13:19:49.917Z"}, {"id": "agent-e5675650b4bbcaa6b709", "category": "economy", "country": "RU", "title": {"ru": "Госдума приняла в первом чтении проект федерального бюджета на 2027–2029 годы", "en": "State Duma Passes Russia's 2027–2029 Draft Federal Budget in First Reading"}, "body": {"ru": "Государственная дума одобрила в первом чтении проект закона о федеральном бюджете на 2027 год и плановый период 2028–2029 годов.", "en": "Russia's State Duma has approved the draft federal budget for 2027 and the 2028–2029 planning period in its first reading."}, "content": {"ru": ["В ходе пленарного заседания в четверг за принятие финансового документа проголосовали 372 депутата, что составило 82,7% присутствовавших в зале парламентариев, сообщает «Коммерсантъ». Против утверждения законопроекта никто не высказался.", "Документ определяет параметры казны на ближайший трехлетний цикл, охватывая 2027 год и плановые периоды 2028 и 2029 годов, уточняет «Интерфакс».", "По данным издания РБК, проект бюджета закладывает существенную корректировку бюджетного правила, а также предполагает превышение уровня государственного долга отметки в 20%."], "en": ["During a parliamentary session on Thursday, 372 lawmakers voted in favor of the bill, representing 82.7% of the deputies present, according to Kommersant. No votes were cast against the measure.", "The legislation establishes federal fiscal framework targets for 2027 alongside projected baselines for 2028 and 2029, Interfax reported.", "According to RBC, the draft budget includes a major adjustment to the national fiscal rule and projects that the government debt level will exceed 20%."]}, "importance": {"ru": "Одобрение проекта в первом чтении фиксирует ключевые концептуальные параметры государственной финансовой системы на ближайшие три года, включая обновленные механизмы бюджетного правила и допустимые объемы госдолга.", "en": "The first reading vote establishes the structural parameters of Russia's public finances for the upcoming three-year cycle, formally advancing revisions to sovereign borrowing limits and fiscal spending rules."}, "next": {"ru": "Законопроекту предстоит пройти процедуры второго и третьего чтений в Государственной думе, в рамках которых депутаты будут рассматривать детальные поправки к распределению средств.", "en": "The draft law will move to its second reading in the State Duma, during which lawmakers will review specific amendments and targeted resource allocations."}, "telegramText": {"ru": "Госдума одобрила в первом чтении проект федерального бюджета на 2027 год и плановый период 2028–2029 годов. \n\nЗа принятие документа проголосовали 372 депутата (82,7% присутствовавших), голосов против подано не было. Как сообщают СМИ, представленный трехлетний проект предполагает значительную корректировку бюджетного правила и закладывает уровень государственного долга выше 20%.", "en": "Russia's State Duma has approved the draft federal budget for 2027–2029 in its first reading.\n\nThe bill was backed by 372 deputies (82.7% of those present), with no votes cast against it. Media reports indicate that the incoming three-year financial plan outlines a significant overhaul of the fiscal rule and projects public debt to surpass 20%."}, "status": "published", "demo": false, "priority": 3, "originalTitle": "Russian State Duma Passes Three-Year Federal Draft Budget in First Reading", "source": {"name": "Коммерсантъ", "url": "https://www.kommersant.ru/doc/9063831", "language": "en"}, "sources": [{"publisher": "Коммерсантъ", "url": "https://www.kommersant.ru/doc/9063831", "confirms": true}, {"publisher": "Интерфакс", "url": "https://www.interfax.ru/business/1125825", "confirms": true}, {"publisher": "РБК", "url": "https://www.rbc.ru/economics/29/10/2026/6ae32b5df1d11a85f97f2468", "confirms": true}], "publishedAt": "2026-10-29T12:29:41.000Z", "updatedAt": "2026-10-29T12:29:41.000Z", "collectedAt": "2026-10-29T12:41:04.181Z", "sitePublishedAt": "2026-10-29T12:41:04.181Z", "publicationMode": "agents", "translationStatus": "ai-bilingual", "factsReviewed": false, "verification": {"verdict": "cross-source", "independentSources": 3, "disputedFacts": [], "problems": [], "notes": "Reported by several outlets in their own feeds", "checkedAt": "2026-10-29T12:41:04.181Z"}, "archive": false, "imageSearchedAt": "2026-10-29T13:20:10.514Z"}, {"id": "agent-d0cb8cc0a5b9d13e8c1c", "category": "science", "country": null, "title": {"ru": "В Обсерватории имени Веры Рубин открыли кандидата в карликовые планеты 2026 ED138", "en": "Astronomers Identify Potential Dwarf Planet 2026 ED138 Beyond Pluto"}, "body": {"ru": "Астрономы с помощью Обсерватории имени Веры Рубин зафиксировали за орбитой Нептуна крупный объект размером до 1500 километров, претендующий на статус карликовой планеты.", "en": "Scientists using the Vera C. Rubin Observatory have detected an object measuring up to 1,500 kilometers across beyond Neptune, identifying it as a candidate dwarf planet."}, "content": {"ru": ["Как сообщили издания iXBT и РБК, обнаруженное небесное тело получило предварительное обозначение 2026 ED138. Открытие было сделано инструментами Обсерватории имени Веры Рубин.", "Объект располагается за орбитами Нептуна и Плутона. По оценкам специалистов, его диаметр может достигать 1500 километров.", "В настоящее время астрономический объект рассматривается исследователями как претендент на статус шестой карликовой планеты."], "en": ["According to reports from iXBT and RBC, the astronomical body has received the preliminary designation 2026 ED138 following its detection by the Vera C. Rubin Observatory.", "The newly detected body is located beyond the orbits of Neptune and Pluto. Its size is estimated to be up to 1,500 kilometers across.", "Researchers consider 2026 ED138 a candidate to potentially become designated as the solar system's sixth dwarf planet."]}, "importance": {"ru": "Обнаружение крупного тела размером до 1500 километров за орбитой Плутона расширяет данные о внешних границах Солнечной системы и количестве массивных транснептуновых объектов.", "en": "The identification of a body up to 1,500 kilometers in diameter beyond Pluto offers new insight into the population of large objects residing in the distant regions of the solar system."}, "next": {"ru": "Ученым предстоит детально изучить параметры орбиты и физические свойства 2026 ED138 для возможного официального утверждения его статуса.", "en": "Astronomers will continue tracking 2026 ED138 to precisely determine its orbital parameters and verify whether it meets the official criteria for dwarf planet classification."}, "telegramText": {"ru": "Астрономы с помощью Обсерватории имени Веры Рубин обнаружили за орбитой Плутона нового кандидата в карликовые планеты. Небесное тело получило предварительное наименование 2026 ED138. По оценкам исследователей, диаметр объекта достигает 1500 километров. В будущем обнаруженное небесное тело может претендовать на статус шестой карликовой планеты.", "en": "Scientists using the Vera C. Rubin Observatory have discovered a new candidate dwarf planet beyond the orbit of Pluto. The body has been provisionally designated 2026 ED138. With an estimated size of up to 1,500 kilometers across, the distant object is a candidate to gain recognition as the sixth dwarf planet."}, "imageQuery": "Vera C. Rubin Observatory", "status": "published", "demo": false, "priority": 3, "originalTitle": "Astronomers Discover Potential Dwarf Planet Beyond Neptune", "source": {"name": "iXBT", "url": "https://www.ixbt.com/news/2026/10/29/observatoriia-imeni-very-rubin-nasla-za-neptunom-obieekt-razmerom-do-1500-km-kandidata-v-karlikovye-planety.html", "language": "en"}, "sources": [{"publisher": "iXBT", "url": "https://www.ixbt.com/news/2026/10/29/observatoriia-imeni-very-rubin-nasla-za-neptunom-obieekt-razmerom-do-1500-km-kandidata-v-karlikovye-planety.html", "confirms": true}, {"publisher": "РБК", "url": "https://www.rbc.ru/society/29/10/2026/6ae30bb95317b954bbe0617d", "confirms": true}], "publishedAt": "2026-10-29T12:14:00.000Z", "updatedAt": "2026-10-29T12:14:00.000Z", "collectedAt": "2026-10-29T13:06:24.551Z", "sitePublishedAt": "2026-10-29T13:06:24.551Z", "publicationMode": "agents", "translationStatus": "ai-bilingual", "factsReviewed": false, "verification": {"verdict": "cross-source", "independentSources": 2, "disputedFacts": [], "problems": [], "notes": "Reported by several outlets in their own feeds", "checkedAt": "2026-10-29T13:06:24.551Z"}, "image": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Vera_C_Rubin_Observatory_in_the_Snow_%28IMG_0315-CC%29.jpg/1920px-Vera_C_Rubin_Observatory_in_the_Snow_%28IMG_0315-CC%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail", "title": "Vera C Rubin Observatory in the Snow (IMG 0315-CC)", "creator": "NOIRLab/NSF/AURA/C. Corco", "license": "CC BY 4.0", "licenseUrl": "https://creativecommons.org/licenses/by/4.0", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Vera_C_Rubin_Observatory_in_the_Snow_(IMG_0315-CC).jpg", "provider": "Wikimedia Commons", "query": "Vera C Rubin Observatory"}, "imageSearchedAt": "2026-10-29T13:18:36.274Z", "archive": false}, {"id": "agent-8c368b844569d2bdafff", "category": "travel", "country": "AM", "title": {"ru": "Самолет «Азимута» вернулся в Ереван из-за проблем с кондиционированием", "en": "Azimuth Flight Returns to Yerevan After Issuing Emergency Signal"}, "body": {"ru": "Пассажирский лайнер авиакомпании «Азимут», вылетевший из Еревана в Минеральные Воды, подал сигнал тревоги и вернулся в аэропорт отправления.", "en": "An Azimuth Airlines flight heading to Mineralnye Vody returned to Yerevan shortly after takeoff following a technical issue."}, "content": {"ru": ["Рейс А46030 российской авиакомпании «Азимут», направлявшийся 29 октября из столицы Армении в Минеральные Воды, совершил разворот спустя примерно 20 минут после взлета. Экипаж принял решение прервать полет из-за возникшей неполадки.", "Как сообщает ТАСС со ссылкой на представителя перевозчика в Армении, поводом для возврата стали проблемы в системе кондиционирования воздуха. В пресс-службе «Азимута» подтвердили «Интерфаксу», что поводом для разворота воздушного судна послужила техническая причина.", "В процессе полета экипаж подал сигнал бедствия, после чего направил самолет обратно в Ереван. Для пассажиров прерванного рейса организована подготовка резервного борта."], "en": ["Flight A46030, operated by Russian carrier Azimuth Airlines from Yerevan to Mineralnye Vody on October 29, turned back to the Armenian capital about 20 minutes into the flight. The crew decided to return to the departure airport after encountering a malfunction.", "According to TASS, citing an airline representative in Armenia, the aircraft returned due to a problem in its air conditioning system. Interfax also reported, citing the airline's press service, that the crew aborted the route for technical reasons.", "Before turning around, the aircraft transmitted a distress signal. The airline has begun preparing a substitute plane to transport the passengers."]}, "importance": {"ru": "Своевременный разворот самолета при неисправностях показывает соблюдение экипажем установленных протоколов авиационной безопасности.", "en": "Prompt turnbacks following technical issues demonstrate adherence to safety protocols when flight systems fail."}, "next": {"ru": "Авиакомпания «Азимут» готовит резервное воздушное судно для доставки пассажиров в пункт назначения.", "en": "Azimuth Airlines is preparing a backup aircraft to take the passengers to Mineralnye Vody."}, "telegramText": {"ru": "Самолет «Азимута», следовавший из Еревана в Минеральные Воды, подал сигнал тревоги и вернулся в аэропорт вылета через 20 минут после старта. По данным ТАСС, причиной стали проблемы с кондиционированием. Как сообщили «Интерфаксу» в пресс-службе перевозчика, для пассажиров готовится резервный борт.", "en": "An Azimuth Airlines flight from Yerevan to Mineralnye Vody issued an emergency signal and returned to Yerevan 20 minutes after takeoff on October 29. According to TASS, the issue was linked to the air conditioning system. Interfax reported that a backup aircraft is being prepared for the passengers."}, "imageQuery": "Azimuth Airlines aircraft", "status": "published", "demo": false, "priority": 3, "originalTitle": "Azimuth Airlines Flight to Mineralnye Vody Diverts Back to Yerevan After Emergency Signal", "source": {"name": "РБК", "url": "https://www.rbc.ru/rbcfreenews/6ae33be7063f45a4a78daa0a", "language": "en"}, "sources": [{"publisher": "РБК", "url": "https://www.rbc.ru/rbcfreenews/6ae33be7063f45a4a78daa0a", "confirms": true}, {"publisher": "Интерфакс", "url": "https://www.interfax.ru/russia/1125815", "confirms": true}, {"publisher": "Лента.ру", "url": "https://lenta.ru/news/2026/10/29/letevshiy-v-rossiyu-samolet-podal-signal-bedstviya/", "confirms": true}], "publishedAt": "2026-10-29T11:23:00.000Z", "updatedAt": "2026-10-29T11:23:00.000Z", "collectedAt": "2026-10-29T13:06:24.551Z", "sitePublishedAt": "2026-10-29T13:06:24.551Z", "publicationMode": "agents", "translationStatus": "ai-bilingual", "factsReviewed": false, "verification": {"verdict": "cross-source", "independentSources": 3, "disputedFacts": [], "problems": [], "notes": "Reported by several outlets in their own feeds", "checkedAt": "2026-10-29T13:06:24.551Z"}, "image": {"url": "https://upload.wikimedia.org/wikipedia/commons/7/7d/Azimuth%2C_RA-89139%2C_Sukhoi_Superjet_100-95B.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled", "title": "Azimuth, RA-89139, Sukhoi Superjet 100-95B", "creator": "Anna Zvereva", "license": "CC BY-SA 2.0", "licenseUrl": "https://creativecommons.org/licenses/by-sa/2.0", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Azimuth,_RA-89139,_Sukhoi_Superjet_100-95B.jpg", "provider": "Wikimedia Commons", "query": "Azimuth Airlines aircraft"}, "imageSearchedAt": "2026-10-29T13:19:16.280Z", "archive": false}, {"id": "agent-f117d5255dd2a1807a46", "category": "science", "country": null, "title": {"ru": "Астронавты вышли в открытый космос для установки новой солнечной батареи на МКС", "en": "Astronauts Step Outside International Space Station to Install Roll-Out Solar Array"}, "body": {"ru": "В четверг двое астронавтов вышли за пределы Международной космической станции для выполнения работ по модернизации бортовой системы электропитания.", "en": "Astronauts aboard the International Space Station conducted a spacewalk on Thursday to carry out scheduled power system upgrades."}, "content": {"ru": ["Как сообщает The Guardian, внекорабельную деятельность осуществляют астронавт NASA Анил Менон и астронавт Канадского космического агентства (CSA) Джошуа Кутрик.", "Перед членами экипажа стоит задача по установке и развертыванию выкатной солнечной батареи International Space Station Roll-Out Solar Array (IROSA).", "По данным агентства «Интерфакс», данные монтажные работы направлены на модернизацию системы энергоснабжения орбитальной лаборатории. Прямую трансляцию происходящего в открытом космосе обеспечивает NASA."], "en": ["NASA astronaut Anil Menon and Canadian Space Agency (CSA) astronaut Joshua Kutryk exited the station to perform the orbital tasks, according to The Guardian.", "The primary objective of the excursion is to install and deploy an International Space Station Roll-Out Solar Array (IROSA) on the exterior of the complex.", "As reported by Interfax, the operation is aimed at modernising the orbiting laboratory's electrical power system. NASA hosted a live stream covering the spacewalk."]}, "importance": {"ru": "Монтаж панелей IROSA позволяет обновить инфраструктуру электроснабжения космической станции, поддерживая ее стабильную работу на орбите.", "en": "The installation of the IROSA unit directly enhances and updates the electrical power generation capabilities supporting the orbital laboratory."}, "next": {"ru": "Астронавтам предстоит завершить запланированные монтажные операции и развертывание панели солнечных батарей перед возвращением внутрь шлюзового отсека.", "en": "The crew must complete the mechanical installation and roll-out deployment of the solar panel before returning inside the airlock."}, "telegramText": {"ru": "Астронавт NASA Анил Менон и астронавт Канадского космического агентства Джошуа Кутрик вышли за пределы Международной космической станции для проведения работ на внешней поверхности комплекса. По информации The Guardian и «Интерфакса», выход посвящен модернизации энергосистемы орбитальной лаборатории: специалистам предстоит установить и развернуть панель солнечных батарей IROSA. Прямой эфир операции ведет NASA.", "en": "NASA astronaut Anil Menon and Canadian Space Agency astronaut Joshua Kutryk have stepped out of the International Space Station for a spacewalk, according to The Guardian and Interfax. The astronauts are working outside the orbital complex to upgrade its power system by installing and deploying an International Space Station Roll-Out Solar Array (IROSA). NASA provided live coverage of the exterior operation."}, "status": "published", "demo": false, "priority": 3, "originalTitle": "Astronauts Conduct Spacewalk Outside International Space Station", "source": {"name": "The Guardian", "url": "https://www.theguardian.com/science/video/2026/oct/29/astronauts-step-out-of-the-iss-for-spacewalk-watc function sourceLine(a){const url=safeURL(a.source?.url);return a.demo?L('Демонстрация · реального источника нет','Sample · no actual news source'):url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(a.source.name)} ↗</a>`:L('Источник отсутствует','Source missing')}
function agentChecks(a){const v=a.verification;if(!v)return '';const list=(a.sources||[]).map(s=>{const url=safeURL(s.url);return url?`<li><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(s.publisher)} ↗</a></li>`:''}).join('');const feeds=v.verdict==='cross-source';return `<div class="auto-checks"><b>✓ ${feeds?L('Сообщили независимые издания','Reported by independent outlets'):L('Проверено вторым агентом','Checked by a second agent')}: ${v.independentSources}</b><p>${feeds?L('Новость опубликована, потому что о ней независимо написали несколько изданий (ссылки ниже). Текст на русском и английском составлен ИИ только по их сообщениям. Ошибки возможны: сверяйтесь с источниками.','Published because several outlets reported it independently (links below). The Russian and English text was written by AI from their reports only. Mistakes are possible: check the sources.'):L('Агент поиска нашёл новость, отдельный агент проверки заново нашёл и открыл источники и подтвердил факты минимум в двух независимых изданиях. Текст на двух языках написан ИИ по подтверждённым фактам. Ошибки возможны: сверяйтесь с источниками.','A search agent found the story; a separate verification agent independently located and opened sources and confirmed the facts in at least two independent outlets. The bilingual text was written by AI from confirmed facts only. Mistakes are possible: check the sources.')}</p>${list?`<ul>${list}</ul>`:''}</div>`}
function sourceBox(a){return `<div class="source-note"><b>${L('Источники и прозрачность','Sources & transparency')}</b><p>${sourceLine(a)}</p>${agentChecks(a)}<p>${L('Опубликовано источником','Source publication')}: ${a.demo?'—':esc(when(a.publishedAt))}<br>${L('Обновлено источником','Source update')}: ${a.demo?'—':esc(when(a.updatedAt||a.publishedAt))}</p>${a.autoChecks?.length===2?`<div class="auto-checks"><b>✓ ${L('Две автопроверки пройдены','Two automated checks passed')}</b><p>${L('1. Лента официального репозитория: адрес, версия, дата. 2. Страница выпуска: совпадение заголовка и времени. Это проверка объявления о выпуске, а не оценка безопасности продукта или независимый фактчекинг.','1. Official repository feed: URL, version, date. 2. Release page: matching heading and time. This validates a release announcement, not product security or independent journalistic fact-checking.')}</p></div>`:''}<p>${a.demo?copy[lang].sourceText:a.verification?L('Оригинальный заголовок: ','Original headline: ')+esc(a.originalTitle):a.autoChecks?.length===2?L('Тестовая автопубликация по двуязычному шаблону. Оригинальный заголовок: ','Test autopublication using a bilingual template. Original heading: ')+esc(a.originalTitle):L('Отметка редактора не гарантирует безошибочность. Текст и ссылку можно проверить самостоятельно.','Editorial approval does not guarantee accuracy. Readers can check the wording and source independently.')}</p></div>`}
function explain(a){return `<div class="explain"><section><span>01</span><h2>${L('Что произошло','What happened')}</h2>${a.content?.[lang]?.length?a.content[lang].map(p=>`<p>${esc(p)}</p>`).join(''):`<p>${esc(text(a,'body'))}</p>`}</section><section><span>02</span><h2>${L('Почему это важно','Why it matters')}</h2><p>${esc(a.importance?.[lang]||L('В демоверсии показана структура объяснения. Для реальной новости значимость формулирует редактор на основании источников.','This sample demonstrates the structure. An editor must explain the significance of real stories using sources.'))}</p></section><section><span>03</span><h2>${L('Что дальше','What comes next')}</h2><p>${esc(a.next?.[lang]||L('Следить за подтверждёнными обновлениями. Здесь появятся ожидаемые события и открытые вопросы без предположений, выданных за факты.','Follow confirmed updates. Expected developments and unanswered questions will appear here without presenting speculation as fact.'))}</p></section></div>`}
function personalBar(){return `<section class="personal-bar" aria-label="${L('Настройка ленты','Feed preferences')}"><div class="region-tabs"><button data-region="world" aria-pressed="${regionMode==='world'}">◎ ${L('Мир','World')}</button><button data-region="local" aria-pressed="${regionMode==='local'}">⌖ ${L('Моя страна','My country')}</button></div><span>${regionMode==='local'&&!country?L('Выберите страну вверху страницы','Choose a country at the top'):L('Мои темы:','My topics:')}</span><div class="interest-chips">${topics.map(c=>`<button data-interest="${c}" aria-pressed="${interests.includes(c)}">${copy[lang][c]} ${interests.includes(c)?'✓':'＋'}</button>`).join('')}</div>${interests.length?`<button id="reset-interests">${L('Сбросить','Reset')}</button>`:''}</section>`}
function digest(list){return `<section class="digest"><div><span class="eyebrow">ATLAS / ${L('КОРОТКО','BRIEFING')}</span><h2>${L('Главное за минуту','The one-minute briefing')}</h2><p>${L('Пять материалов вашей ленты: коротко, с источниками и иллюстрациями.','Five stories from your feed, with sources and illustrative previews.')}</p></div><ol>${list.slice(0,5).map(a=>`<li><a href="#article/${a.id}"><span class="brief-photo">${image(a)}</span><span class="brief-copy"><strong>${esc(text(a,'title'))}</strong><span>${esc(text(a,'body'))}</span><small>${a.demo?copy[lang].sample:esc(a.source?.name||'')}${a.archive?' · '+L('АРХИВ','ARCHIVE'):''}</small></span></a></li>`).join('')||`<li>${copy[lang].empty}</li>`}</ol></section>`}
function telegramChannel(category){const value=connections.telegram?.[lang]?.[category]||connections.telegram?.[lang]?.all;try{const u=new URL(value);return u.protocol==='https:'&&u.hostname==='t.me'&&/^\/[A-Za-z][A-Za-z0-9_]{4,31}$/.test(u.pathname)&&!u.search&&!u.hash&&!u.username&&!u.password?u.href:null}catch{return null}}
function subscriptionBlock(category){const channel=telegramChannel(category),endpoint=connections.newsletterEndpoint;return `<section class="subscribe-block"><div class="subscribe-intro"><span class="eyebrow">ATLAS / ${L('ПОДПИСКА','FOLLOW THE STORY')}</span><h2>${L('Новости там, где удобно','Stay in the loop')}</h2><p>${L('Выбирайте темы. Получайте подборки без бесконечной ленты.','Choose your topics. Get a digest without the endless feed.')}</p></div><div class="subscribe-channel"><span class="subscription-icon">↗</span><h3>Telegram</h3><p>${L('Новости раздела в отдельном канале.','Follow this section in its own channel.')}</p>${channel?`<a class="subscription-link" href="${esc(channel)}" target="_blank" rel="noopener noreferrer">${L('Подписаться на канал','Follow the channel')} ↗</a>`:`<span class="coming-soon">${L('Канал готовится — ссылка появится после запуска','Channel coming soon — link available after launch')}</span>`}</div><div class="subscribe-email"><h3>Email</h3><p>${L('Подборка выбранных тем. Отписаться можно в каждом письме.','A digest of your selected topics. Unsubscribe in every email.')}</p><form id="newsletter-form"><label class="sr-only" for="newsletter-email">Email</label><div class="email-input"><input id="newsletter-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required ${newsletterReady?'':'disabled'}><button ${newsletterReady?'':'disabled'}>${L('Подписаться','Subscribe')} →</button></div><label class="consent-label"><input name="consent" type="checkbox" required ${newsletterReady?'':'disabled'}>${L('Согласен на хранение email и получение новостей. Подписку нужно подтвердить письмом.','I agree to email storage and news delivery. Confirmation by email is required.')}</label><p id="newsletter-status" role="status">${newsletterReady?L('Сначала отправим письмо для подтверждения.','We will send a confirmation email first.'):L('Email-подписка готовится. Адреса пока не собираем.','Email subscriptions are coming soon. We are not collecting addresses yet.')}</p></form></div></section>`}
const issueText={demo:['Демонстрационный материал','Sample content'],source:['Нужна HTTPS-ссылка на источник','An HTTPS source is required'],title:['Заполните заголовки','Titles are required'],date:['Не удалось проверить дату','Publication date is invalid'],future:['Дата находится в будущем','Publication date is in the future'],stale:['Материал старше 72 часов: не подходит для свежей ленты','Older than 72 hours: not eligible for the fresh feed'],translation:['Перевод не проверен редактором','Translation needs editorial review'],facts:['Факты ещё не подтверждены редактором','Facts need human review']};
function reviewPanel(){const t=copy[lang];return `<section class="category-heading"><span>NEWSROOM / ${previewMode?'PREVIEW':'EDITOR'}</span><h1>${t.queue}</h1><p>${L('Оригинал → проверка → ваше решение. Автоматические проверки не подтверждают достоверность фактов.','Original → review → your decision. Automated checks do not establish factual accuracy.')}</p>${previewMode?`<div class="review-warning">${L('Показ интерфейса. Настоящие черновики и кнопки публикации доступны только на локальном сервере. GitHub Pages не запускает редакцию.','Interface preview. Real drafts and publishing controls are available only on the local server. GitHub Pages cannot run the newsroom.')}</div>`:`<button class="collect-button" id="collect">${L('Получить свежие материалы','Collect source updates')}</button>`}<div id="collection-report" role="status"></div></section><div class="review-list">${pending.map(a=>`<form class="review-item" data-edit="${a.id}"><div class="review-original"><div class="eyebrow">${L('ПЕРВОИСТОЧНИК','ORIGINAL SOURCE')}</div><h2>${esc(a.originalTitle||text(a,'title'))}</h2>${sourceBox(a)}<div class="checks"><b>${L('Проверки','Checks')}</b><ul>${(a.checks?.issues||['demo']).map(i=>`<li>${esc((issueText[i]||[i,i])[lang==='ru'?0:1])}</li>`).join('')||`<li>${L('Формальные проверки пройдены','Formal checks passed')}</li>`}</ul><small>${L('ИИ-проверка не подключена. Проверка фактов — ответственность редактора.','AI verification is not connected. The editor is responsible for checking facts.')}</small></div></div><div class="review-draft"><div class="eyebrow">${L('РЕДАКТОРСКИЙ ТЕКСТ','EDITORIAL DRAFT')}</div>${[['titleRu','Заголовок RU',a.title.ru],['titleEn','Title EN',a.title.en],['bodyRu','Что произошло RU',a.body.ru],['bodyEn','What happened EN',a.body.en],['importanceRu','Почему важно RU',a.importance?.ru||''],['importanceEn','Why it matters EN',a.importance?.en||''],['nextRu','Что дальше RU',a.next?.ru||''],['nextEn','What comes next EN',a.next?.en||'']].map(([name,label,val])=>`<label>${label}<textarea name="${name}" required maxlength="3999" ${previewMode?'readonly':''}>${esc(val)}</textarea></label>`).join('')}<label class="check-label"><input name="factsReviewed" type="checkbox" ${a.factsReviewed?'checked':''} ${previewMode?'disabled':''}>${L('Я сверил факты с первоисточником','I checked the facts against the source')}</label><label class="check-label"><input name="translationReviewed" type="checkbox" ${a.translationStatus==='reviewed'?'checked':''} ${previewMode?'disabled':''}>${L('Я проверил русскую и английскую версии','I reviewed both language versions')}</label><div class="review-actions"><button type="submit" ${previewMode?'disabled':''}>${L('Сохранить проверку','Save review')}</button><button type="button" data-id="${a.id}" data-action="publish" ${previewMode||!a.checks?.canPublish?'disabled':''}>${t.publish}</button><button type="button" data-id="${a.id}" data-action="reject" ${previewMode?'disabled':''}>${t.reject}</button></div></div></form>`).join('')||`<p>${L('Очередь пуста. Получите материалы из источников.','The queue is empty. Collect materials from the sources.')}</p>`}</div>`}
function meta(a){const t=copy[lang];return `<div class="meta"><span>${t[a.category]}</span><span>${a.country?t[a.country]:t.world} · ${a.demo?t.sample:esc(when(a.publishedAt))}${!a.demo&&a.archive?' · '+L('АРХИВ','ARCHIVE'):''}</span></div>`}
function card(a,small=false){const t=copy[lang];return `<a class="story ${small?'compact':''}" href="#article/${a.id}"><div class="image-wrap">${image(a)}<span class="image-arrow">↗</span></div><div class="story-content">${meta(a)}<h3>${esc(text(a,'title'))}</h3>${small?'':`<p>${esc(text(a,'body'))}</p>`}<div class="readtime">4 ${t.min} <span>↗</span></div></div></a>`}
function render(){const t=copy[lang],r=route();document.documentElement.lang=lang;document.documentElement.dataset.theme=storage.getItem('theme')||'light';document.title=`ATLAS — ${r.kind==='category'?t[r.id]||t.home:t.tag}`;
const list=articles.filter(a=>(regionMode!=='local'||!country||a.country===country)&&(!interests.length||interests.includes(a.category))&&(!query||text(a,'title').toLowerCase().includes(query.toLowerCase())));const selected=r.kind==='category'?r.id:'';
app.innerHTML=`<div class="reading-progress" id="progress"></div><div class="demo-bar">${articles.some(a=>a.verification)?L('Новости находят и перепроверяют ИИ-агенты · у каждого материала указаны источники','Stories are found and cross-checked by AI agents · sources listed on every story'):articles.some(a=>!a.demo)?L('ТЕСТОВЫЙ ЗАПУСК · Реальные объявления и отдельные демоматериалы · Старые выпуски помечены архивом','TEST EDITION · Real announcements alongside labelled samples · Older releases labelled archive'):articles.every(a=>a.demo)?t.demo:L('Тестовая редакция · источники указаны у материалов · публикация после проверки','Pilot newsroom · source links on each story · editorial approval required')}</div><header><div class="topline"><span class="edition"><i></i> ${t.tag}</span><div class="utilities"><select id="country" aria-label="${t.filter}"><option value="">◎ ${t.world}</option>${['US','GB','RU'].map(c=>`<option value="${c}">${t[c]}</option>`).join('')}</select><select id="language" aria-label="Language"><option value="ru">RU</option><option value="en">EN</option></select><button id="theme" aria-label="${t.theme}">◐</button><a class="cabinet-link" href="${previewMode?'cabinet.html':'/cabinet'}">${userName?esc(userName):L('Кабинет','Account')}</a></div></div><div class="masthead"><a class="wordmark" href="#home">atlas<span>●</span></a><p>ATLAS / ${L('КОНТЕКСТ','CONTEXT')}<br><strong>${L('КАЖДАЯ НОВОСТЬ — СО ССЫЛКАМИ НА ИЗДАНИЯ','EVERY STORY LINKS TO ITS OUTLETS')}</strong></p><span class="edition-no">${L('ВЫПУСК','EDITION')}<br>${esc(new Intl.DateTimeFormat(lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Moscow'}).format(new Date()).toUpperCase())}</span></div><nav><a href="#home" class="${r.kind==='home'?'active':''}">${t.home}</a>${topics.map(c=>`<a href="#category/${c}" class="${selected===c?'active':''}">${t[c]}</a>`).join('')}${editorEnabled||previewMode?`<a href="#review">${t.review}${previewMode?' · '+L('демо','demo'):''}</a>`:''}<button id="search-toggle" aria-label="${t.search}">⌕</button></nav><div id="search-box" ${query?'':'hidden'}><input id="search" type="search" placeholder="${t.search}" value="${esc(query)}" aria-label="${t.search}"></div></header><main id="main"></main><footer><a class="wordmark" href="#home">atlas<span>●</span></a><p>${t.tag}<br><small>${t.demo}</small></p><a href="#home">↑ ${t.home}</a></footer><div class="toast" id="toast" role="status"></div>`;
const main=document.querySelector('#main');
if(loadError)main.innerHTML=`<p class="empty">${t.error}</p>`;
else if(r.kind==='article'){
const a=articles.find(x=>x.id===r.id);if(!a)main.innerHTML=`<p class="empty">${t.empty}</p>`;else{
const saved=storage.getItem('saved-'+a.id)==='1';
main.innerHTML=`<article class="article-page"><a class="back" href="#category/${a.category}">← ${t[a.category]}</a><div class="article-heading">${meta(a)}<h1>${esc(text(a,'title'))}</h1><p class="standfirst">${esc(text(a,'body'))}</p><div class="byline"><div class="avatar">a.</div><div><b>${t.author}</b><small>${a.demo?t.sample:esc(when(a.publishedAt))}${!a.demo&&a.archive?' · '+L('АРХИВ','ARCHIVE'):''} · 4 ${t.min}</small></div><button id="save">${saved?'✓':'＋'} ${saved?t.saved:t.save}</button><button id="share">↗ ${t.share}</button><a class="telegram-share" href="https://t.me/share/url?url=${encodeURIComponent((connections.siteUrl||'https://dirol982.github.io/Diroll25/')+'#article/'+a.id)}&text=${encodeURIComponent(text(a,'title'))}" target="_blank" rel="noopener noreferrer">Telegram ↗</a></div></div><figure>${image(a)}<figcaption>${a.image?photoCredit(a.image):a.demo?t.photo:L('Графическая обложка ATLAS · иллюстрация','ATLAS graphic cover · illustration')}</figcaption></figure><div class="article-layout"><aside><span>ATLAS / ${t[a.category]}</span><p>${a.demo?t.sourceText:a.verification?L('Новость найдена и перепроверена ИИ-агентами по нескольким независимым источникам. Подробности ниже.','Found and cross-checked by AI agents against several independent sources. Details below.'):a.autoChecks?.length===2?L('Две автоматические сверки официального объявления. Подробности проверок ниже.','Two automated checks of the official announcement. Verification details below.'):L('Материал одобрен редактором. Первоисточник доступен ниже.','Editorially approved. The original source is linked below.')}</p></aside><div class="prose">${explain(a)}${sourceBox(a)}<div id="ad-article"></div></div></div>${subscriptionBlock(a.category)}<div class="section-heading"><h2>${t.readnext}</h2><a href="#home">${t.all} ↗</a></div><div class="cards">${articles.filter(x=>x.id!==a.id).slice(0,3).map(x=>card(x)).join('')}</div></article>`;
document.querySelector('#save').onclick=()=>{storage.setItem('saved-'+a.id,saved?'0':'1');if(signedIn)demoFetch('/api/me/bookmarks/'+encodeURIComponent(a.id),{method:saved?'DELETE':'PUT'}).catch(()=>{});render()};document.querySelector('#share').onclick=async()=>{try{if(location.protocol==='file:')throw Error();await navigator.clipboard.writeText(location.href);toast(t.copied)}catch{toast(t.shareFail)}};
}}
else if(r.kind==='review'&&(editorEnabled||previewMode)){main.innerHTML=reviewPanel();
main.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const res=await demoFetch(`/api/review/${b.dataset.id}?action=${b.dataset.action}`,{method:'POST'});if(!res.ok){const x=await res.json();throw Error(x.error)}await load()}catch(e){toast(e.message||t.error);b.disabled=false}});
main.querySelectorAll('[data-edit]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();if(previewMode)return;const data=Object.fromEntries(new FormData(f));data.factsReviewed=f.elements.factsReviewed.checked;data.translationReviewed=f.elements.translationReviewed.checked;try{const res=await demoFetch(`/api/review/${f.dataset.edit}?action=edit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!res.ok)throw Error();await load();toast(L('Проверка сохранена','Review saved'))}catch{toast(t.error)}});
const collect=document.querySelector('#collect');if(collect)collect.onclick=async()=>{collect.disabled=true;collect.textContent=L('Получаем материалы…','Collecting…');try{const res=await demoFetch('/api/collect',{method:'POST'});if(!res.ok)throw Error();const data=await res.json();await load();document.querySelector('#collection-report').textContent=L('Добавлено: ','Added: ')+data.added+' · '+data.reports.map(x=>x.source+': '+(x.ok?'OK':x.error)).join(' · ')}catch{toast(t.error)}finally{const b=document.querySelector('#collect');if(b){b.disabled=false;b.textContent=L('Получить свежие материалы','Collect source updates')}}};
}else if(r.kind==='category'){
const items=list.filter(a=>a.category===r.id);main.innerHTML=`<section class="category-heading"><span>ATLAS / ${t.section}</span><h1>${t[r.id]||t.home}<em>↗</em></h1><p>${t.intro}</p></section>${items.length?`<div class="category-feature">${card(items[0])}<div class="category-note"><span>${L('ГЛАВНОЕ','THE BIG PICTURE')}</span><h2>${t.lead}</h2><p>${t.sourceText}</p></div></div><div class="section-heading"><h2>${t.latest}</h2><span>${String(items.length).padStart(2,'0')}</span></div><div class="cards">${items.map(a=>card(a)).join('')}</div>`:`<p class="empty">${t.empty}</p>`}`;
}else{
main.innerHTML=`${personalBar()}${digest(list)}<div class="page-intro"><span><i></i> ${t.today}</span><span>${L('ПРОВЕРЕНО · КОРОТКО · С ИСТОЧНИКАМИ','CHECKED · CONCISE · SOURCED')}</span></div>${list.length?`<section class="front-grid"><a class="lead-story" href="#article/${list[0].id}">${image(list[0])}<div class="lead-shade"></div><div class="lead-content"><span class="pill">${t[list[0].category]} / ${list[0].demo?t.sample:L('ИСТОЧНИК','SOURCE')}</span><h1>${esc(text(list[0],'title'))}</h1><p>${esc(text(list[0],'body'))}</p><span class="lead-link">${t.read} <b>↗</b></span></div></a><div class="side-stories">${list.slice(1,3).map(a=>card(a,true)).join('')}</div><aside class="editors"><div class="sidebar-heading">${t.popular} <i></i></div>${[...list].reverse().slice(0,4).map((a,i)=>`<a href="#article/${a.id}"><span class="rank">0${i+1}</span><div><small>${t[a.category]}</small><h3>${esc(text(a,'title'))}</h3><span class="readtime">4 ${t.min}</span></div></a>`).join('')}</aside></section><div class="section-heading"><h2>${t.latest}<span class="dot">●</span></h2><a href="#category/technology">${t.section} ↗</a></div><div class="cards">${list.slice(1).map(a=>card(a)).join('')}</div>`:`<p class="empty">${t.empty}</p>`}<section class="advert" id="ad-feed"><span>${L('Реклама на ATLAS','Advertise on ATLAS')}</span><h2>${t.ad}</h2><p>${t.adText}</p><a href="${previewMode?'cabinet.html':'/cabinet'}#campaigns"><b>ATLAS / ${L('РАЗМЕСТИТЬ РЕКЛАМУ','ADVERTISE')} ↗</b></a></section><div class="section-heading"><h2>${t.section}</h2><span>${L('РАЗДЕЛЫ ATLAS','EXPLORE ATLAS')}</span></div><div class="topic-grid">${topics.map((c,i)=>`<a href="#category/${c}"><span>0${i+1}</span><h3>${t[c]}</h3><b>↗</b></a>`).join('')}</div>`;
}
if(r.kind==='home'||r.kind==='category')main.insertAdjacentHTML('beforeend',subscriptionBlock(r.id));
document.querySelector('#language').value=lang;document.querySelector('#country').value=country;
document.querySelector('#language').onchange=e=>{lang=e.target.value;storage.setItem('language',lang);render()};document.querySelector('#country').onchange=e=>{country=e.target.value;regionMode=country?'local':'world';storage.setItem('country',country);storage.setItem('regionMode',regionMode);render()};document.querySelector('#theme').onclick=()=>{storage.setItem('theme',document.documentElement.dataset.theme==='dark'?'light':'dark');render()};document.querySelector('#search-toggle').onclick=()=>{const box=document.querySelector('#search-box');box.hidden=!box.hidden;if(!box.hidden)document.querySelector('#search').focus()};document.querySelector('#search').oninput=e=>{const pos=e.target.selectionStart;query=e.target.value;render();const input=document.querySelector('#search');input.focus();input.setSelectionRange(pos,pos)};
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{regionMode=b.dataset.region;storage.setItem('regionMode',regionMode);render()});
document.querySelectorAll('[data-interest]').forEach(b=>b.onclick=()=>{const c=b.dataset.interest;interests=interests.includes(c)?interests.filter(x=>x!==c):[...interests,c];storage.setItem('interests',JSON.stringify(interests));render()});
const reset=document.querySelector('#reset-interests');if(reset)reset.onclick=()=>{interests=[];storage.setItem('interests','[]');render()};
const newsletter=document.querySelector('#newsletter-form');if(newsletter)newsletter.onsubmit=async e=>{e.preventDefault();if(!newsletterReady)return;const button=newsletter.querySelector('button'),status=document.querySelector('#newsletter-status');button.disabled=true;try{const endpoint=connections.newsletterEndpoint||'/api/newsletter/subscribe';const res=await demoFetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:newsletter.elements.email.value,consent:newsletter.elements.consent.checked,language:lang,topics:interests})});if(!res.ok)throw Error();status.textContent=L('Проверьте почту и подтвердите подписку по ссылке.','Check your inbox and confirm your subscription using the link.');newsletter.reset()}catch{status.textContent=L('Письмо не отправлено. Попробуйте позже.','Confirmation could not be sent. Please try later.')}finally{button.disabled=false}};
loadAd(r);progress();}
async function loadAd(r){const slot=document.querySelector(r.kind==='article'?'#ad-article':'#ad-feed');if(!slot||previewMode)return;const topic=r.kind==='article'?articles.find(x=>x.id===r.id)?.category:r.kind==='category'?r.id:'';try{const res=await demoFetch(`/api/ads?placement=${r.kind==='article'?'article':'feed'}&lang=${lang}${topic?'&topic='+topic:''}`);if(!res.ok)return;const {ad}=await res.json();if(!ad)return;slot.className='advert sponsored';slot.innerHTML=`<span>${L('Реклама','Advertisement')} · ${esc(ad.advertiserName)}${ad.erid?' · erid: '+esc(ad.erid):''}</span><h2>${esc(ad.title)}</h2><p>${esc(ad.text)}</p><a href="${esc(ad.url)}" target="_blank" rel="sponsored noopener"><b>${L('Подробнее','Learn more')} ↗</b></a>`}catch{}}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('visible');setTimeout(()=>el.classList.remove('visible'),3000)}
function progress(){const el=document.querySelector('#progress');if(el)el.style.width=(window.scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)*100)+'%'}
async function load(){try{const c=await demoFetch('/api/config');if(!c.ok)throw Error();const config=await c.json();editorEnabled=config.editorEnabled;previewMode=!!config.staticPreview;connections=config.connections||{telegram:{ru:{},en:{}}};newsletterReady=!!config.newsletterReady;signedIn=!!config.user;userName=config.user?.name||config.user?.email||'';const r=await demoFetch('/api/articles');if(!r.ok)throw Error();articles=(await r.json()).sort((a,b)=>Number(!!a.demo)-Number(!!b.demo)||(Date.parse(b.publishedAt)||0)-(Date.parse(a.publishedAt)||0));if(editorEnabled||previewMode){const p=await demoFetch('/api/review');if(!p.ok)throw Error();pending=await p.json()}loadError=false}catch{loadError=true}render()}
window.addEventListener('hashchange',()=>{query='';render();window.scrollTo({top:0,behavior:'instant'})});window.addEventListener('scroll',progress,{passive:true});load();
</script></body></html>
